<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teezgram (티즈그램)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
        }
        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(100px, 30vw);
            gap: 2px;
        }
        @media (min-width: 768px) {
            .explore-grid { grid-auto-rows: 250px; gap: 16px; }
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 1; }
            100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
        }
        .floating-emoji {
            position: absolute;
            bottom: 60px;
            left: 20px;
            font-size: 26px;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-pink-100 selection:text-pink-600">

    <div id="app" class="min-h-screen flex flex-col md:flex-row max-w-6xl mx-auto bg-white shadow-sm border-x border-gray-100">

        <!-- Sidebar Navigation (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 border-r border-gray-200 p-4 fixed h-full bg-white z-20">
            <div class="py-6 px-3 flex items-center justify-between">
                <h1 class="text-2xl font-semibold tracking-tight font-serif italic cursor-pointer text-pink-600" onclick="switchTab('feed')">Teezgram</h1>
            </div>
            <nav class="space-y-1 flex-1">
                <button onclick="switchTab('feed')" id="nav-feed" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-house text-xl w-6"></i> 홈
                </button>
                <button onclick="switchTab('explore')" id="nav-explore" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-compass text-xl w-6"></i> 탐색
                </button>
                <button onclick="switchTab('dm')" id="nav-dm" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-regular fa-paper-plane text-xl w-6"></i> 다이렉트 (DM)
                </button>
                <button onclick="openNewStoryModal()" id="admin-story-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-amber-600 transition">
                    <i class="fa-solid fa-circle-plus text-xl w-6"></i> 스토리 올리기 (관리자)
                </button>
                <button onclick="openNewPostModal()" id="admin-create-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-pink-600 transition">
                    <i class="fa-regular fa-square-plus text-xl w-6"></i> 피드 올리기 (관리자)
                </button>
                <button onclick="openNewAccountModal()" id="admin-create-account-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-purple-600 transition">
                    <i class="fa-solid fa-user-plus text-xl w-6"></i> 새 캐릭터 추가 (관리자)
                </button>
                <button onclick="viewProfile(store.currentAccount)" id="nav-profile" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <img id="nav-user-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-gray-300"> 프로필
                </button>
            </nav>

            <div class="border-t border-gray-200 pt-4 mt-auto">
                <div class="text-xs font-semibold text-gray-400 px-3 mb-2 uppercase tracking-wider">등장인물 계정 전환</div>
                <div id="account-switcher" class="space-y-1 max-h-36 overflow-y-auto hide-scrollbar"></div>
                
                <div class="mt-4 p-2 bg-gray-50 rounded-lg border text-center">
                    <span id="admin-status-text" class="text-xs font-bold text-gray-600">독자 모드</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 md:ml-64 pb-20 md:pb-0 min-h-screen">
            <header class="md:hidden sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-30">
                <h1 class="text-xl font-bold font-serif italic text-pink-600 cursor-pointer" onclick="switchTab('feed')">Teezgram</h1>
                <div class="flex items-center gap-2">
                    <span id="mobile-admin-text" class="text-xs bg-pink-50 text-pink-600 px-2.5 py-1 rounded-full font-bold border border-pink-200">독자모드</span>
                    <button onclick="switchTab('dm')" class="text-xl text-gray-700 px-1"><i class="fa-regular fa-paper-plane"></i></button>
                </div>
            </header>

            <!-- VIEW 1: HOME FEED -->
            <div id="view-feed" class="max-w-lg mx-auto py-4 px-2 md:px-0 space-y-6">
                <!-- Stories Carousel -->
                <div class="bg-white border md:border-gray-200 md:rounded-lg p-4 overflow-x-auto hide-scrollbar flex gap-4">
                    <div id="stories-container" class="flex gap-4"></div>
                </div>
                <!-- Feed Posts -->
                <div id="feed-posts-container" class="space-y-6"></div>
            </div>

            <!-- VIEW 2: EXPLORE / SEARCH -->
            <div id="view-explore" class="hidden max-w-4xl mx-auto py-4 px-2 md:px-4">
                <div class="mb-4 flex gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="explore-search-input" onkeyup="filterExplore()" placeholder="검색 (#해시태그, 아이디, 키워드)..." class="w-full bg-gray-100 pl-10 pr-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-300">
                    </div>
                    <button onclick="renderExploreGrid()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs font-semibold text-gray-600 flex items-center gap-1">
                        <i class="fa-solid fa-rotate"></i> 새로고침
                    </button>
                </div>
                <div id="explore-grid-container" class="explore-grid"></div>
            </div>

            <!-- VIEW 3: DM -->
            <div id="view-dm" class="hidden max-w-3xl mx-auto py-4 px-2 md:px-4">
                <div class="bg-white border rounded-lg h-[80vh] flex overflow-hidden shadow-sm">
                    <div class="w-1/3 border-r border-gray-200 flex flex-col">
                        <div class="p-4 border-b font-semibold text-sm flex justify-between items-center">
                            <span>대화 상대</span>
                            <span class="text-xs text-pink-600">현재: @<span id="dm-current-account-label"></span></span>
                        </div>
                        <div id="dm-conversations-list" class="flex-1 overflow-y-auto divide-y divide-gray-100"></div>
                    </div>
                    <div class="w-2/3 flex flex-col bg-gray-50">
                        <div id="dm-chat-header" class="p-4 bg-white border-b flex items-center gap-3">
                            <img id="dm-header-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                            <span id="dm-header-username" class="font-semibold text-sm">상대방을 선택하세요</span>
                        </div>
                        <div id="dm-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col"></div>
                        <form id="dm-input-form" onsubmit="handleSendDm(event)" class="p-3 bg-white border-t flex flex-col gap-2">
                            <div class="flex gap-2">
                                <input type="text" id="dm-input-text" placeholder="메시지 보내기..." class="flex-1 border rounded-full px-4 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-pink-500">
                                <button type="submit" id="dm-send-btn" class="text-sm font-semibold text-pink-600 px-3">전송</button>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-500 px-2">
                                <span>보낸 시간 표기:</span>
                                <input type="text" id="dm-input-time" value="오후 10:14" class="border rounded px-2 py-0.5 w-28 text-xs">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- VIEW 4: PROFILE -->
            <div id="view-profile" class="hidden max-w-4xl mx-auto py-6 px-4">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-12 mb-6 border-b border-gray-200 pb-6">
                    <div id="profile-avatar-container" class="w-24 h-24 sm:w-36 sm:h-36 rounded-full p-1 cursor-pointer" onclick="openProfileStory()">
                        <img id="profile-avatar" src="" class="w-full h-full object-cover rounded-full border-2 border-white">
                    </div>

                    <div class="flex-1 text-center sm:text-left space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                            <h2 id="profile-username" class="text-xl font-normal">username</h2>
                            <div class="flex gap-2 justify-center">
                                <button onclick="openEditProfileModal()" id="admin-edit-profile-btn" class="hidden px-4 py-1.5 bg-gray-100 hover:bg-gray-200 font-semibold text-sm rounded-lg transition">
                                    프로필 편집 (관리자)
                                </button>
                                <button onclick="handleToggleFollow()" id="profile-follow-btn" class="px-4 py-1.5 bg-sky-500 hover:bg-sky-600 text-white font-semibold text-sm rounded-lg transition">
                                    팔로우
                                </button>
                            </div>
                        </div>

                        <div class="flex justify-center sm:justify-start gap-8 text-sm">
                            <div>게시물 <span id="profile-posts-count" class="font-semibold">0</span></div>
                            <div>팔로워 <span id="profile-followers-count" class="font-semibold">0</span></div>
                            <div>팔로잉 <span id="profile-following-count" class="font-semibold">0</span></div>
                        </div>

                        <div class="text-sm space-y-1">
                            <div id="profile-fullname" class="font-semibold">Full Name</div>
                            <div id="profile-bio" class="whitespace-pre-line text-gray-700">Bio content...</div>
                        </div>
                    </div>
                </div>

                <!-- Story Highlights Bar -->
                <div class="mb-6 overflow-x-auto hide-scrollbar">
                    <div class="flex gap-6 px-2" id="profile-highlights-container"></div>
                </div>

                <div id="profile-posts-grid" class="grid grid-cols-3 gap-1 sm:gap-4"></div>
            </div>
        </main>

        <!-- Fixed Bottom Bar -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center py-2.5 z-40 md:left-64 shadow-lg">
            <button onclick="openModeSelectModal()" class="flex flex-col items-center text-pink-600 hover:text-pink-700">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-bold mt-0.5">홈</span>
            </button>
            <button onclick="switchTab('explore'); closeModal('modal-post-detail');" class="flex flex-col items-center text-gray-700 hover:text-pink-600">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
                <span class="text-[10px] font-medium mt-0.5">검색</span>
            </button>
        </nav>
    </div>

    <!-- MODAL: MODE SELECT -->
    <div id="modal-mode-select" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-6 text-center space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800">모드 선택</h3>
            <p class="text-xs text-gray-500">원하시는 모드를 선택하여 홈으로 이동합니다.</p>
            <div class="space-y-2 pt-2">
                <button onclick="selectReaderMode()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl text-sm transition">
                    📖 독자 모드
                </button>
                <button onclick="selectAdminMode()" class="w-full py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-xl text-sm transition">
                    👑 관리자 모드
                </button>
            </div>
            <button onclick="closeModal('modal-mode-select')" class="text-xs text-gray-400 underline pt-2">닫기</button>
        </div>
    </div>

    <!-- FULL FEED SCROLL MODAL -->
    <div id="modal-post-detail" onclick="handleOutsideClick(event)" class="hidden fixed inset-0 bg-black/80 z-50 overflow-y-auto pb-20">
        <div class="max-w-lg mx-auto py-6 px-2">
            <div id="modal-feed-scroll-container" class="space-y-6"></div>
        </div>
    </div>

    <!-- STORY VIEWER MODAL -->
    <div id="modal-story-viewer" onclick="handleStoryViewerOutsideClick(event)" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-2">
        <div id="story-viewer-card" class="relative w-full max-w-sm h-[85vh] bg-gray-900 rounded-2xl overflow-hidden flex flex-col justify-between p-4 border border-gray-800">
            <!-- 스토리 상단 바 (인디케이터 및 프로필/시간, 삭제 버튼) -->
            <div class="flex flex-col gap-2 z-10">
                <div id="story-progress-bars" class="flex gap-1 w-full"></div>
                <div class="flex items-center justify-between text-white">
                    <div class="flex items-center gap-2">
                        <img id="story-view-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                        <span id="story-view-username" class="font-semibold text-sm">username</span>
                        <span id="story-view-time" class="text-xs text-gray-300 ml-1">시간</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="admin-story-delete-btn" onclick="handleDeleteCurrentStory()" class="hidden text-red-400 hover:text-red-300 text-sm px-2" title="스토리 삭제"><i class="fa-solid fa-trash-can"></i></button>
                        <button onclick="closeModal('modal-story-viewer')" class="text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
            </div>

            <!-- 플로팅 이모지 애니메이션 레이어 -->
            <div id="story-floating-emoji-container" class="absolute inset-0 overflow-hidden pointer-events-none z-20"></div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <img id="story-view-img" src="" class="w-full h-full object-cover pointer-events-auto">
                <button id="story-prev-btn" onclick="slideStoryItem(-1)" class="absolute left-2 bg-black/50 hover:bg-black/80 text-white rounded-full w-9 h-9 flex items-center justify-center text-sm z-20 pointer-events-auto">❮</button>
                <button id="story-next-btn" onclick="slideStoryItem(1)" class="absolute right-2 bg-black/50 hover:bg-black/80 text-white rounded-full w-9 h-9 flex items-center justify-center text-sm z-20 pointer-events-auto">❯</button>
            </div>

            <!-- 하단부: 이모지 선택 및 채팅/DM 답장 입력 바 -->
            <div class="relative z-30 space-y-2">
                <div id="story-reactions-display" class="bg-black/40 backdrop-blur-sm px-3 py-2 rounded-xl flex items-center justify-between text-white text-xs cursor-pointer hover:bg-black/60 transition">
                    <div id="story-reactions-avatars" class="flex items-center gap-2 overflow-x-auto hide-scrollbar"></div>
                    <span id="story-reactions-summary-text" class="text-[11px] text-gray-300 font-medium whitespace-nowrap ml-2">활동 없음</span>
                </div>

                <!-- 관리자용 스토리 채팅 & DM 연동 답장 입력 바 -->
                <div id="story-reactions-input-bar" class="relative bg-black/50 backdrop-blur-md rounded-full px-3 py-1.5 flex items-center gap-2 text-white">
                    <!-- 위로 펼쳐지는 이모지 6개 팝업 메뉴 -->
                    <div id="story-emoji-popover" class="hidden absolute bottom-12 left-0 bg-black/80 backdrop-blur-md rounded-2xl px-3 py-2 flex gap-3 text-2xl border border-gray-700 shadow-2xl z-40">
                        <button onclick="sendStoryEmoji('❤️')">❤️</button>
                        <button onclick="sendStoryEmoji('🔥')">🔥</button>
                        <button onclick="sendStoryEmoji('😂')">😂</button>
                        <button onclick="sendStoryEmoji('😮')">😮</button>
                        <button onclick="sendStoryEmoji('😢')">😢</button>
                        <button onclick="sendStoryEmoji('👏')">👏</button>
                    </div>

                    <!-- 맨 왼쪽 이모지 토글 버튼 -->
                    <button type="button" onclick="toggleEmojiPopover()" class="text-xl p-1 text-gray-300 hover:text-white transition">😊</button>

                    <!-- 채팅/DM 답장 입력창 -->
                    <input type="text" id="story-reply-input" placeholder="스토리에 답장하기..." class="flex-1 bg-transparent text-xs text-white placeholder-gray-400 focus:outline-none px-1" onkeypress="if(event.key==='Enter') sendStoryReplyMessage()">

                    <!-- 전송 버튼 -->
                    <button type="button" onclick="sendStoryReplyMessage()" class="text-xs font-semibold text-pink-500 hover:text-pink-400 px-2 py-1">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: STORY REACTIONS DETAIL (누가 남겼는지 확인하는 팝업) -->
    <div id="modal-story-reactions-detail" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">스토리 활동</h3>
                <button onclick="closeModal('modal-story-reactions-detail')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="story-reactions-detail-list" class="space-y-3 max-h-60 overflow-y-auto divide-y divide-gray-100"></div>
        </div>
    </div>

    <!-- MODAL: ADMIN LOGIN -->
    <div id="modal-admin" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-user-shield text-pink-500"></i> 작가 관리자 로그인</h3>
            <p class="text-xs text-gray-500">관리자 비밀번호를 입력하여 관리자 모드로 전환하세요.</p>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">관리자 비밀번호</label>
                <input type="password" id="admin-password-input" placeholder="비밀번호 입력" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
            </div>
            <div class="flex gap-2">
                <button onclick="closeModal('modal-admin')" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold">취소</button>
                <button onclick="loginAdmin()" class="flex-1 py-2 bg-pink-500 text-white rounded-lg text-sm font-semibold hover:bg-pink-600">확인</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT STORY -->
    <div id="modal-new-story" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="story-modal-title" class="font-bold">새 스토리 올리기</h3>
                <button onclick="closeModal('modal-new-story')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleSaveStory(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">캐릭터 계정</label>
                    <select id="story-author-select" class="w-full border rounded-lg p-2 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">스토리 사진 파일 첨부</label>
                    <input type="file" id="story-image-file" accept="image/*" class="w-full text-xs text-gray-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">업로드 시간 표기</label>
                    <input type="text" id="story-time-input" value="3시간 전" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <button type="submit" class="w-full py-2 bg-amber-500 text-white rounded-lg font-semibold">저장하기</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT HIGHLIGHT -->
    <div id="modal-highlight" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="highlight-modal-title" class="font-bold text-sm">스토리 하이라이트 편집</h3>
                <button onclick="closeModal('modal-highlight')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleSaveHighlight(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">하이라이트 폴더 제목</label>
                    <input type="text" id="highlight-title-input" required placeholder="예: 추억 🐱" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-1 focus:ring-pink-500">
                </div>

                <div id="highlight-current-section" class="space-y-1">

    <script>
        const INITIAL_DATA = {
            isAdmin: false,

            currentAccount: 'san_choi',
            activeDmTarget: 'wooyoung_j',
            accounts: {

                    highlights: [

                            ]
                        }
                    ]
                },
                'wooyoung_j': {
                    username: 'wooyoung_j',
                    fullName: '정우영',
                    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
                    bio: 'ATEEZ / 🐈‍⬛ 우요냥\nMain Dancer. @san_choi',
                    followers: ['san_choi'],
                    following: ['san_choi'],
                    highlights: []
                }
            },
            stories: [
                {
                    id: 's1',
                    author: 'san_choi',
                    image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=80',
                    time: '2시간 전',
                    reactions: [{ sender: 'wooyoung_j', emoji: '🔥' }]
                }
            ],
            storyArchive: [
                { id: 'sa1', author: 'san_choi', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600', time: '2시간 전', reactions: [{ sender: 'wooyoung_j', emoji: '🔥' }] },
                { id: 'sa2', author: 'san_choi', image: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600', time: '어제', reactions: [] }
            ],
            posts: [
                {
                    id: 'p1',
                    author: 'san_choi',
                    images: [
                        'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=80',
                        'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop&q=80'
                    ],
                    activeImgIdx: 0,
                    caption: '연습 끝나고 오랫만에 카페. @wooyoung_j #일상 #카페 ☕️',
                    likes: 342,
                    likedByMe: false,
                    time: '3시간 전',
                    comments: [{ author: 'wooyoung_j', text: '다음엔 내가 사줄게 ㅋㅋㅋ #카페' }]
                }
            ],
            dms: {
                'san_choi_wooyoung_j': [
                    { sender: 'wooyoung_j', text: '산아 연습 마치고 카페 가냐?', time: '오후 08:10' },
                    { sender: 'san_choi', text: '응 왜?', time: '오후 08:12' }
                ]
            }
        };

        let store = JSON.parse(localStorage.getItem('teezgram_v6_store')) || INITIAL_DATA;
        if (!store.storyArchive) {
            store.storyArchive = [
                { id: 'sa_init', author: 'san_choi', image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600', time: '최근 기록', reactions: [] }
            ];
        }

        let activeTab = 'feed';
        let activeProfileId = 'san_choi';
        let currentDetailPostId = null;
        
        let activeStoryViewer = {
            isHighlight: false,
            author: '',
            items: [],
            currentIndex: 0,
            title: ''
        };

        let editingDmIndex = null;
        let editingPostId = null;
        let editingHighlightId = null;

        function saveStore() {
            localStorage.setItem('teezgram_v6_store', JSON.stringify(store));
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAccountSwitcher();
            renderStories();
            switchTab('feed');
            updateAdminUI();
        });

        function openModeSelectModal() {
            closeModal('modal-post-detail');
            document.getElementById('modal-mode-select').classList.remove('hidden');
        }

        function selectReaderMode() {
            store.isAdmin = false;
            saveStore();
            updateAdminUI();
            closeModal('modal-mode-select');
            switchTab('feed');
        }

        function selectAdminMode() {
            closeModal('modal-mode-select');
            if (store.isAdmin) {
                switchTab('feed');
            } else {
                document.getElementById('modal-admin').classList.remove('hidden');
            }
        }

        function loginAdmin() {
            const inputPass = document.getElementById('admin-password-input').value;
            if (inputPass === store.adminPass) {
                store.isAdmin = true;
                saveStore();
                updateAdminUI();
                closeModal('modal-admin');
                document.getElementById('admin-password-input').value = '';
                switchTab('feed');
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        }

        function updateAdminUI() {
            const adminBtns = [
                'admin-create-btn-side', 'admin-create-btn-top',
                'admin-create-account-btn-side', 'admin-story-btn-side', 'admin-edit-profile-btn'
            ];
            adminBtns.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('hidden', !store.isAdmin);
            });

            const statusText = document.getElementById('admin-status-text');
            const mobileText = document.getElementById('mobile-admin-text');

            if (store.isAdmin) {
                if(statusText) statusText.innerText = '👑 관리자 모드 중';
                if(mobileText) mobileText.innerText = '관리자모드';
            } else {
                if(statusText) statusText.innerText = '📖 독자 모드 중';
                if(mobileText) mobileText.innerText = '독자모드';
            }

            const storyInputBar = document.getElementById('story-reactions-input-bar');
            if (storyInputBar) {
                storyInputBar.style.display = store.isAdmin ? 'flex' : 'none';
            }

            const dmInputForm = document.getElementById('dm-input-form');
            if (dmInputForm) {
                dmInputForm.style.display = store.isAdmin ? 'flex' : 'none';
            }

            if (activeTab === 'feed') renderFeed();
            if (activeTab === 'profile') renderProfile(activeProfileId);
            if (activeTab === 'dm') renderDmView();
        }

        function switchTab(tab) {
            activeTab = tab;
            ['feed', 'explore', 'dm', 'profile'].forEach(t => {
                document.getElementById('view-' + t).classList.add('hidden');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');

            if (tab === 'feed') {
                renderFeed();
                renderStories();
            }
            else if (tab === 'explore') renderExploreGrid();
            else if (tab === 'dm') renderDmView();
            else if (tab === 'profile') renderProfile(activeProfileId);
            window.scrollTo(0,0);
        }

        function getDmKey(u1, u2) {
            return [u1, u2].sort().join('_');
        }

        function renderDmView() {
            document.getElementById('dm-current-account-label').innerText = store.currentAccount;
            const listEl = document.getElementById('dm-conversations-list');
            listEl.innerHTML = '';

            const otherAccounts = Object.keys(store.accounts).filter(u => u !== store.currentAccount);

            if (otherAccounts.length === 0) {
                listEl.innerHTML = '<div class="p-4 text-xs text-gray-400 text-center">대화할 상대 캐릭터가 없습니다.</div>';
                return;
            }

            if (!store.activeDmTarget || store.activeDmTarget === store.currentAccount) {
                store.activeDmTarget = otherAccounts[0];
            }

            otherAccounts.forEach(username => {
                const acc = store.accounts[username];
                const key = getDmKey(store.currentAccount, username);
                const chatHistory = store.dms[key] || [];
                const lastMsg = chatHistory.length > 0 ? chatHistory[chatHistory.length - 1].text : '새 대화를 시작하세요.';

                const btn = document.createElement('button');
                btn.className = `w-full p-3 flex items-center gap-3 text-left hover:bg-gray-50 transition ${store.activeDmTarget === username ? 'bg-pink-50/60' : ''}`;
                btn.onclick = () => selectDmTarget(username);
                btn.innerHTML = `
                    <img src="${acc.avatar}" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-xs text-gray-800">${acc.username}</div>
                        <div class="text-xs text-gray-400 truncate mt-0.5">${lastMsg}</div>
                    </div>
                `;
                listEl.appendChild(btn);
            });

            selectDmTarget(store.activeDmTarget);
        }

        function selectDmTarget(targetUsername) {
            store.activeDmTarget = targetUsername;
            const targetAcc = store.accounts[targetUsername];
            if (!targetAcc) return;

            document.getElementById('dm-header-avatar').src = targetAcc.avatar;
            document.getElementById('dm-header-username').innerText = targetAcc.username + ' (' + targetAcc.fullName + ')';

            const container = document.getElementById('dm-messages-container');
            container.innerHTML = '';

            const key = getDmKey(store.currentAccount, targetUsername);
            const chatHistory = store.dms[key] || [];

            chatHistory.forEach((msg, idx) => {
                const isMe = msg.sender === store.currentAccount;
                const div = document.createElement('div');
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} group`;
                
                // DM 내 스토리 연동 메시지 카드 렌더링
                let storyCardHTML = '';
                if (msg.storyImage) {
                    storyCardHTML = `
                        <div class="mb-1 rounded-xl overflow-hidden border border-gray-200/80 bg-gray-900/90 max-w-[200px] text-white">
                            <div class="p-1.5 text-[10px] text-gray-300 font-medium flex items-center gap-1 border-b border-gray-800">
                                <i class="fa-solid fa-arrow-turn-down text-[9px]"></i> 스토리에 답장함
                            </div>
                            <img src="${msg.storyImage}" class="w-full h-28 object-cover">
                        </div>
                    `;
                }

                div.innerHTML = `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[85%]">
                        ${storyCardHTML}
                        <div class="flex items-center gap-1.5 ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                            <div class="px-3.5 py-2 rounded-2xl text-xs ${isMe ? 'bg-pink-500 text-white rounded-br-none' : 'bg-white border border-gray-200 text-gray-800 rounded-bl-none'} shadow-sm">
                                ${msg.text}
                            </div>
                            ${store.isAdmin ? `
                                <button onclick="openEditDmModal(${idx})" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-gray-600 text-[10px] p-1 transition">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                    <span class="text-[9px] text-gray-400 mt-1 px-1">${msg.time}</span>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleSendDm(e) {
            e.preventDefault();
            if (!store.isAdmin) return;
            const input = document.getElementById('dm-input-text');
            const timeInput = document.getElementById('dm-input-time');
            const text = input.value.trim();
            const time = timeInput.value.trim() || '방금 전';

            if (!text || !store.activeDmTarget) return;

            const key = getDmKey(store.currentAccount, store.activeDmTarget);
            if (!store.dms[key]) store.dms[key] = [];

            store.dms[key].push({
                sender: store.currentAccount,
                text,
                time
            });

            saveStore();
            input.value = '';
            renderDmView();
        }

        function openEditDmModal(index) {
            if (!store.isAdmin) return;
            const key = getDmKey(store.currentAccount, store.activeDmTarget);
            const msg = store.dms[key][index];
            if (!msg) return;

            editingDmIndex = index;
            document.getElementById('edit-dm-text').value = msg.text;
            document.getElementById('edit-dm-time').value = msg.time;
            document.getElementById('modal-edit-dm').classList.remove('hidden');
        }

        function handleSaveEditDm(e) {
            e.preventDefault();
            if (!store.isAdmin) return;
            if (editingDmIndex === null || !store.activeDmTarget) return;

            const key = getDmKey(store.currentAccount, store.activeDmTarget);
            const text = document.getElementById('edit-dm-text').value.trim();
            const time = document.getElementById('edit-dm-time').value.trim();

            if (store.dms[key] && store.dms[key][editingDmIndex]) {
                store.dms[key][editingDmIndex].text = text;
                store.dms[key][editingDmIndex].time = time;
                saveStore();
                renderDmView();
                closeModal('modal-edit-dm');
            }
        }

        function handleDeleteDmMsg() {
            if (!store.isAdmin) return;
            if (editingDmIndex === null || !store.activeDmTarget) return;
            if (!confirm('이 메시지를 삭제하시겠습니까?')) return;

            const key = getDmKey(store.currentAccount, store.activeDmTarget);
            if (store.dms[key]) {
                store.dms[key].splice(editingDmIndex, 1);
                saveStore();
                renderDmView();
                closeModal('modal-edit-dm');
            }
        }

        function buildPostCardHTML(post) {
            const authorAcc = store.accounts[post.author] || { username: post.author, avatar: '' };
            const images = post.images || [post.image];
            const activeIdx = post.activeImgIdx || 0;

            return `
                <article class="bg-white border md:border-gray-200 md:rounded-lg overflow-hidden shadow-sm">
                    <div class="flex items-center justify-between p-3 border-b border-gray-100">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="viewProfile('${authorAcc.username}'); closeModal('modal-post-detail');">
                            <img src="${authorAcc.avatar}" class="w-8 h-8 rounded-full object-cover">
                            <span class="font-semibold text-sm hover:underline">${authorAcc.username}</span>
                        </div>
                        ${store.isAdmin ? `
                            <button onclick="openEditPostModal('${post.id}')" class="text-gray-400 hover:text-gray-600 text-sm px-2">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                        ` : ''}
                    </div>

                    <div class="relative bg-black flex items-center justify-center max-h-[500px]">
                        <img src="${images[activeIdx]}" class="w-full object-cover max-h-[500px]">
                        ${images.length > 1 ? `
                            <button onclick="slidePostImg('${post.id}', -1)" class="absolute left-2 bg-black/50 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs">❮</button>
                            <button onclick="slidePostImg('${post.id}', 1)" class="absolute right-2 bg-black/50 text-white rounded-full w-7 h-7 flex items-center justify-center text-xs">❯</button>
                            <div class="absolute top-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full">${activeIdx + 1}/${images.length}</div>
                        ` : ''}
                    </div>

                    <div class="p-3 space-y-2">
                        <div class="flex gap-4 text-xl">
                            <button onclick="toggleLike('${post.id}')"><i class="${post.likedByMe ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'}"></i></button>
                            <button onclick="openPostDetailModal('${post.id}')"><i class="fa-regular fa-comment"></i></button>
                        </div>
                        <div class="font-semibold text-xs">좋아요 ${post.likes}개</div>
                        <div class="text-sm"><b>${authorAcc.username}</b> ${formatMentionsAndTags(post.caption)}</div>
                        
                        ${post.comments.length > 0 ? `
                            <div class="space-y-1 text-xs border-t pt-2 mt-2">
                                ${post.comments.map(c => `<div><b>${c.author}</b> <span>${formatMentionsAndTags(c.text)}</span></div>`).join('')}
                            </div>
                        ` : ''}

        function slidePostImg(postId, direction) {
            const post = store.posts.find(p => p.id === postId);
            if (!post || !post.images) return;
            let idx = (post.activeImgIdx || 0) + direction;
            if (idx < 0) idx = post.images.length - 1;
            if (idx >= post.images.length) idx = 0;
            post.activeImgIdx = idx;
            saveStore();
            renderFeed();
            if (!document.getElementById('modal-post-detail').classList.contains('hidden')) {
                renderScrollFeedModal();
            }
        }

        // 스토리 이모지 전송 & DM 연동
        function sendStoryEmoji(emoji) {
            if (!store.isAdmin || activeStoryViewer.isHighlight) return;
            const currentItem = activeStoryViewer.items[activeStoryViewer.currentIndex];
            if (!currentItem) return;

            if (!currentItem.reactions) currentItem.reactions = [];
            currentItem.reactions.unshift({ sender: store.currentAccount, emoji });

            // DM 연동 메시지 생성
            const storyAuthor = currentItem.author || activeStoryViewer.author;
            if (storyAuthor && storyAuthor !== store.currentAccount) {
                const dmKey = getDmKey(store.currentAccount, storyAuthor);
                if (!store.dms[dmKey]) store.dms[dmKey] = [];
                store.dms[dmKey].push({
                    sender: store.currentAccount,
                    text: emoji,
                    time: '방금 전',
                    storyImage: currentItem.image
                });
            }

            saveStore();
            renderStoryReactions();
            triggerFloatingEmoji(emoji);
            document.getElementById('story-emoji-popover').classList.add('hidden');
        }

        // 스토리 답장 텍스트 메시지 전송 & DM 연동
        function sendStoryReplyMessage() {
            if (!store.isAdmin || activeStoryViewer.isHighlight) return;
            const input = document.getElementById('story-reply-input');
            const text = input.value.trim();
            if (!text) return;

            const currentItem = activeStoryViewer.items[activeStoryViewer.currentIndex];
            if (!currentItem) return;

            const storyAuthor = currentItem.author || activeStoryViewer.author;
            if (storyAuthor && storyAuthor !== store.currentAccount) {
                const dmKey = getDmKey(store.currentAccount, storyAuthor);
                if (!store.dms[dmKey]) store.dms[dmKey] = [];
                store.dms[dmKey].push({
                    sender: store.currentAccount,
                    text: text,
                    time: '방금 전',
                    storyImage: currentItem.image
                });
            }

            saveStore();

            alert('스토리 답장이 DM으로 전달되었습니다!');

        function handleSaveStory(e) {
            e.preventDefault();
            if (!store.isAdmin) return;
            const author = document.getElementById('story-author-select').value;
            const time = document.getElementById('story-time-input').value.trim() || '방금 전';
            const fileInput = document.getElementById('story-image-file');

            const saveStoryObj = (imgUrl) => {
                const newStoryObj = {
                    id: 's_' + Date.now(),
                    author,
                    image: imgUrl,
                    time,
                    reactions: []
                };

                store.stories.unshift(newStoryObj);

                if (!store.storyArchive) store.storyArchive = [];
                store.storyArchive.unshift({
                    id: 'sa_' + Date.now(),
                    author,
                    image: imgUrl,
                    time,
                    reactions: []
                });

                saveStore();
                renderStories();
                if (activeTab === 'profile') renderProfile(activeProfileId);
                closeModal('modal-new-story');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => saveStoryObj(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveStoryObj('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600');
            }
        }

        function handleToggleFollow() {
            const currentAcc = store.accounts[store.currentAccount];
            const targetAcc = store.accounts[activeProfileId];
            if (!currentAcc || !targetAcc || store.currentAccount === activeProfileId) return;

            if (!currentAcc.following) currentAcc.following = [];
            if (!targetAcc.followers) targetAcc.followers = [];

            const isFollowing = currentAcc.following.includes(activeProfileId);
            if (isFollowing) {
                currentAcc.following = currentAcc.following.filter(u => u !== activeProfileId);
                targetAcc.followers = targetAcc.followers.filter(u => u !== store.currentAccount);
            } else {
                currentAcc.following.push(activeProfileId);
                targetAcc.followers.push(store.currentAccount);
            }
            saveStore();
            renderProfile(activeProfileId);
        }

        function viewProfile(username) { activeProfileId = username; switchTab('profile'); }

                    <div class="w-14 h-14 rounded-full p-[2px] border-2 border-gray-200">

        function openNewHighlightModal() {
            if (!store.isAdmin) return;
            editingHighlightId = null;
            document.getElementById('highlight-modal-title').innerText = '새 하이라이트 폴더 만들기';
            document.getElementById('highlight-title-input').value = '';
            document.getElementById('highlight-current-section').classList.add('hidden');
            document.getElementById('highlight-delete-btn').classList.add('hidden');

            document.getElementById('modal-highlight').classList.remove('hidden');

        function openEditHighlightModal(highlightId) {
            if (!store.isAdmin) return;
            const acc = store.accounts[activeProfileId];
            if (!acc || !acc.highlights) return;
            const h = acc.highlights.find(item => item.id === highlightId);
            if (!h) return;

            editingHighlightId = highlightId;
            document.getElementById('highlight-modal-title').innerText = '하이라이트 폴더 수정';
            document.getElementById('highlight-title-input').value = h.title;
            document.getElementById('highlight-current-section').classList.remove('hidden');

            const currentGrid = document.getElementById('highlight-current-images-grid');
            currentGrid.innerHTML = '';
            const currentImgs = h.images && h.images.length > 0 ? h.images : [h.cover];
            currentImgs.forEach((imgUrl, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'relative aspect-square rounded overflow-hidden border group';
                wrap.innerHTML = `
                    <img src="${imgUrl}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeHighlightImage('${highlightId}', ${idx})" class="absolute top-0.5 right-0.5 bg-red-600 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] opacity-80 hover:opacity-100">×</button>
                `;

            renderArchivePicker(currentImgs, h.reactions || []);
            document.getElementById('highlight-delete-btn').classList.remove('hidden');
            document.getElementById('modal-highlight').classList.remove('hidden');

        function renderArchivePicker(existingImages, existingReactions) {
            const picker = document.getElementById('story-archive-picker');
            picker.innerHTML = '';
            const archiveList = store.storyArchive || [];

            if (archiveList.length === 0) {
                picker.innerHTML = `<div class="col-span-4 text-xs text-gray-400 text-center py-4">저장된 스토리 보관함 기록이 없습니다.</div>`;
                return;
            }

            archiveList.forEach((item, index) => {
                const isAlreadyIncluded = existingImages.includes(item.image);
                const wrap = document.createElement('label');
                wrap.className = `relative aspect-square rounded overflow-hidden border cursor-pointer block ${isAlreadyIncluded ? 'opacity-45' : 'hover:ring-2 hover:ring-pink-500'}`;
                wrap.innerHTML = `
                    <img src="${item.image}" class="w-full h-full object-cover">
                    <input type="checkbox" name="archive-story-chk" value="${index}" ${isAlreadyIncluded ? 'disabled' : ''} class="absolute top-1 left-1 rounded text-pink-600 focus:ring-pink-500">
                    <div class="absolute bottom-0 inset-x-0 bg-black/50 text-white text-[9px] text-center truncate px-0.5">${item.time}</div>
                `;
                picker.appendChild(wrap);
            });
        }

        function removeHighlightImage(highlightId, imgIdx) {
            const acc = store.accounts[activeProfileId];
            if (!acc || !acc.highlights) return;
            const h = acc.highlights.find(item => item.id === highlightId);
            if (!h || !h.images) return;

            if (h.images.length <= 1) {
                alert('하이라이트에는 최소 1장의 사진이 있어야 합니다. 폴더를 삭제하려면 하단의 폴더 삭제를 이용해주세요.');
                return;
            }

            h.images.splice(imgIdx, 1);
            if (h.reactions && h.reactions[imgIdx]) h.reactions.splice(imgIdx, 1);
            h.cover = h.images[0];
            saveStore();
            openEditHighlightModal(highlightId);
            renderProfile(activeProfileId);
        }

        function handleSaveHighlight(e) {
            e.preventDefault();
            if (!store.isAdmin) return;

            const acc = store.accounts[activeProfileId];
            if (!acc) return;
            if (!acc.highlights) acc.highlights = [];

            const title = document.getElementById('highlight-title-input').value.trim();
            const checkedCheckboxes = document.querySelectorAll('input[name="archive-story-chk"]:checked');
            
            const selectedImages = [];
            const selectedReactions = [];
            checkedCheckboxes.forEach(chk => {
                const archiveItem = store.storyArchive[parseInt(chk.value)];
                if (archiveItem) {
                    selectedImages.push(archiveItem.image);
                    selectedReactions.push(archiveItem.reactions || []);
                }
            });

            if (editingHighlightId) {
                const h = acc.highlights.find(item => item.id === editingHighlightId);
                if (h) {
                    h.title = title;
                    if (!h.images) h.images = [h.cover];
                    if (!h.reactions) h.reactions = [];
                    if (selectedImages.length > 0) {
                        h.images.push(...selectedImages);
                        h.reactions.push(...selectedReactions);
                    }
                    if (h.images && h.images.length > 0) {
                        h.cover = h.images[0];
                    }
                }
            } else {
                const finalImgs = selectedImages.length > 0 ? selectedImages : ['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600'];
                const finalReactions = selectedReactions.length > 0 ? selectedReactions : [[]];
                acc.highlights.push({
                    id: 'h_' + Date.now(),
                    title,
                    cover: finalImgs[0],
                    images: finalImgs,
                    reactions: finalReactions
                });
            }

            saveStore();
            closeModal('modal-highlight');
            renderProfile(activeProfileId);
        }

        function handleDeleteHighlight() {
            if (!store.isAdmin) return;
            if (!editingHighlightId) return;
            if (!confirm('이 하이라이트 폴더를 통째로 삭제하시겠습니까?')) return;

            const acc = store.accounts[activeProfileId];
            if (acc && acc.highlights) {
                acc.highlights = acc.highlights.filter(h => h.id !== editingHighlightId);
                saveStore();
                closeModal('modal-highlight');
                renderProfile(activeProfileId);
            }
        }

        function openNewPostModal() {
            if (!store.isAdmin) return;
            editingPostId = null;
            document.getElementById('post-modal-title').innerText = '새 피드 올리기 (여러 장 가능)';
            document.getElementById('post-caption').value = '';
            document.getElementById('post-likes').value = 124;
            document.getElementById('post-time').value = '방금 전';
            document.getElementById('post-delete-btn').classList.add('hidden');
            document.getElementById('modal-new-post').classList.remove('hidden');
        }

        function openEditPostModal(postId) {
            if (!store.isAdmin) return;
            const post = store.posts.find(p => p.id === postId);
            if (!post) return;

            editingPostId = postId;
            document.getElementById('post-modal-title').innerText = '피드 수정';
            document.getElementById('post-author-select').value = post.author;
            document.getElementById('post-caption').value = post.caption;
            document.getElementById('post-likes').value = post.likes;
            document.getElementById('post-time').value = post.time;
            document.getElementById('post-delete-btn').classList.remove('hidden');
            document.getElementById('modal-new-post').classList.remove('hidden');
        }

        function handleSavePost(e) {
            e.preventDefault();
            if (!store.isAdmin) return;
            const author = document.getElementById('post-author-select').value;
            const caption = document.getElementById('post-caption').value.trim();
            const likes = parseInt(document.getElementById('post-likes').value) || 100;
            const time = document.getElementById('post-time').value.trim() || '방금 전';
            const fileInput = document.getElementById('post-image-files');

            const readMultipleFiles = (files) => {
                return Promise.all(Array.from(files).map(file => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                }));
            };

            const processSave = (newImages) => {
                if (editingPostId) {
                    const post = store.posts.find(p => p.id === editingPostId);
                    if (post) {
                        post.author = author;
                        post.caption = caption;
                        post.likes = likes;
                        post.time = time;
                        if (newImages && newImages.length > 0) {
                            post.images = newImages;
                            post.activeImgIdx = 0;
                        }
                    }
                } else {
                    store.posts.unshift({
                        id: 'p_' + Date.now(),
                        author,
                        images: (newImages && newImages.length > 0) ? newImages : ['https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600'],
                        activeImgIdx: 0,
                        caption,
                        likes,
                        likedByMe: false,
                        time,
                        comments: []
                    });
                }
                saveStore();
                closeModal('modal-new-post');
                renderFeed();
                if (activeTab === 'profile') renderProfile(activeProfileId);
            };

            if (fileInput.files && fileInput.files.length > 0) {
                readMultipleFiles(fileInput.files).then(images => processSave(images));
            } else {
                processSave(null);
            }
        }

        function handleDeletePost() {
            if (!store.isAdmin) return;
            if (!editingPostId) return;
            if (!confirm('이 피드를 삭제하시겠습니까?')) return;

            store.posts = store.posts.filter(p => p.id !== editingPostId);
            saveStore();
            closeModal('modal-new-post');
            renderFeed();
            if (activeTab === 'profile') renderProfile(activeProfileId);
        }

        function handleAddComment(e, postId) {
            e.preventDefault();
            if (!store.isAdmin) return;
            const input = e.target.querySelector('input');
            const text = input.value.trim();
            if (!text) return;
            const post = store.posts.find(p => p.id === postId);
            if (post) {
                post.comments.push({ author: store.currentAccount, text });
                saveStore();
                input.value = '';
                renderFeed();
                if (!document.getElementById('modal-post-detail').classList.contains('hidden')) {
                    renderScrollFeedModal();
                }
            }
        }

        function toggleLike(postId) {
            const post = store.posts.find(p => p.id === postId);
            if (post) {
                post.likedByMe = !post.likedByMe;
                post.likes += post.likedByMe ? 1 : -1;
                saveStore();
                renderFeed();
                if (!document.getElementById('modal-post-detail').classList.contains('hidden')) {
                    renderScrollFeedModal();
                }
            }
        }

        function openNewAccountModal() {
            if (!store.isAdmin) return;
            document.getElementById('modal-new-account').classList.remove('hidden');
        }

        function handleCreateAccount(e) {
            e.preventDefault();
            if (!store.isAdmin) return;
            const username = document.getElementById('new-acc-username').value.trim();
            const fullName = document.getElementById('new-acc-fullname').value.trim();
            const bio = document.getElementById('new-acc-bio').value.trim();
            const fileInput = document.getElementById('new-acc-avatar-file');

            if (!username || store.accounts[username]) {
                alert('이미 존재하는 아이디이거나 올바르지 않습니다.');
                return;
            }

            const saveAcc = (avatarUrl) => {
                store.accounts[username] = {
                    username,
                    fullName,
                    avatar: avatarUrl,
                    bio,
                    followers: [],
                    following: [],
                    highlights: []
                };
                saveStore();
                renderAccountSwitcher();
                closeModal('modal-new-account');
                alert('@' + username + ' 캐릭터가 추가되었습니다.');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => saveAcc(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveAcc('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150');
            }
        }

        function renderAccountSwitcher() {
            const container = document.getElementById('account-switcher');
            const selectPost = document.getElementById('post-author-select');
            const selectStory = document.getElementById('story-author-select');
            container.innerHTML = ''; selectPost.innerHTML = ''; selectStory.innerHTML = '';

            Object.values(store.accounts).forEach(acc => {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-2 p-2 rounded-lg text-left text-xs ${store.currentAccount === acc.username ? 'bg-pink-50 text-pink-600 font-semibold' : 'hover:bg-gray-50'}`;
                btn.onclick = () => {
                    store.currentAccount = acc.username;
                    saveStore();
                    renderAccountSwitcher();
                    if (activeTab === 'dm') renderDmView();
                    if (activeTab === 'profile') renderProfile(activeProfileId);
                };
                btn.innerHTML = `<img src="${acc.avatar}" class="w-5 h-5 rounded-full object-cover"><span class="truncate">${acc.username}</span>`;
                container.appendChild(btn);

                const opt = `<option value="${acc.username}">@${acc.username} (${acc.fullName})</option>`;
                selectPost.innerHTML += opt;
                selectStory.innerHTML += opt;
            });

            const cur = store.accounts[store.currentAccount] || Object.values(store.accounts)[0];
            if (cur) {
                document.getElementById('nav-user-avatar').src = cur.avatar;
            }
        }

        function formatMentionsAndTags(text) {
            if (!text) return '';
            return text
                .replace(/@([a-zA-Z0-9_]+)/g, '<span class="text-pink-600 font-semibold cursor-pointer hover:underline" onclick="event.stopPropagation(); closeModal(\'modal-post-detail\'); viewProfile(\'$1\')">@$1</span>')
                .replace(/#([가-힣a-zA-Z0-9_]+)/g, '<span class="text-pink-600 font-semibold cursor-pointer hover:underline" onclick="event.stopPropagation(); searchHashtag(\'$1\')">#$1</span>');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
