<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teezgram (티즈그램)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
        }
        .story-ring {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(100px, 30vw);
            gap: 2px;
        }
        @media (min-width: 768px) {
            .explore-grid { grid-auto-rows: 250px; gap: 16px; }
        }
        .explore-item-large { grid-column: span 2; grid-row: span 2; }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-pink-100 selection:text-pink-600">

    <div id="app" class="min-h-screen flex flex-col md:flex-row max-w-6xl mx-auto bg-white shadow-sm border-x border-gray-100">

        <!-- Sidebar Navigation (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 border-r border-gray-200 p-4 fixed h-full bg-white z-20">
            <div class="py-6 px-3 flex items-center justify-between">
                <h1 class="text-2xl font-semibold tracking-tight font-serif italic cursor-pointer text-pink-600" onclick="switchTab('feed')">Teezgram</h1>
            </div>
            <nav class="space-y-1 flex-1">
                <button onclick="switchTab('feed')" id="nav-feed" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-house text-xl w-6"></i> 홈
                </button>
                <button onclick="switchTab('explore')" id="nav-explore" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-solid fa-compass text-xl w-6"></i> 탐색
                </button>
                <button onclick="switchTab('dm')" id="nav-dm" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <i class="fa-regular fa-paper-plane text-xl w-6"></i> 다이렉트 (DM)
                </button>
                <button onclick="openNewStoryModal()" id="admin-story-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-amber-600 transition">
                    <i class="fa-solid fa-circle-plus text-xl w-6"></i> 스토리 올리기 (관리자)
                </button>
                <button onclick="openNewPostModal()" id="admin-create-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-pink-600 transition">
                    <i class="fa-regular fa-square-plus text-xl w-6"></i> 피드 올리기 (관리자)
                </button>
                <button onclick="openNewAccountModal()" id="admin-create-account-btn-side" class="hidden w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 text-purple-600 transition">
                    <i class="fa-solid fa-user-plus text-xl w-6"></i> 새 캐릭터 추가 (관리자)
                </button>
                <button onclick="viewProfile(currentAccount)" id="nav-profile" class="w-full flex items-center gap-4 p-3 font-medium rounded-lg hover:bg-gray-100 transition">
                    <img id="nav-user-avatar" src="" class="w-6 h-6 rounded-full object-cover border border-gray-300"> 프로필
                </button>
            </nav>

            <div class="border-t border-gray-200 pt-4 mt-auto">
                <div class="text-xs font-semibold text-gray-400 px-3 mb-2 uppercase tracking-wider">등장인물 계정 전환</div>
                <div id="account-switcher" class="space-y-1 max-h-36 overflow-y-auto hide-scrollbar"></div>
                <button onclick="toggleAdminModal()" id="admin-toggle-btn" class="mt-4 w-full text-xs py-2 px-3 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-lock" id="admin-lock-icon"></i> <span id="admin-status-text">독자 모드 (클릭하여 관리자 로그인)</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 md:ml-64 pb-16 md:pb-0 min-h-screen">
            <header class="md:hidden sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex justify-between items-center z-30">
                <h1 class="text-xl font-bold font-serif italic text-pink-600 cursor-pointer" onclick="switchTab('feed')">Teezgram</h1>
                <div class="flex items-center gap-3">
                    <button onclick="switchTab('dm')" class="text-xl text-gray-700"><i class="fa-regular fa-paper-plane"></i></button>
                    <button onclick="toggleAdminModal()" class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-700 font-medium">
                        <i class="fa-solid fa-lock" id="mobile-admin-lock-icon"></i>
                    </button>
                    <button onclick="openNewPostModal()" id="admin-create-btn-top" class="hidden text-pink-600">
                        <i class="fa-regular fa-square-plus text-2xl"></i>
                    </button>
                </div>
            </header>

            <!-- VIEW 1: HOME FEED -->
            <div id="view-feed" class="max-w-lg mx-auto py-4 px-2 md:px-0 space-y-6">
                <!-- Stories Carousel -->
                <div class="bg-white border md:border-gray-200 md:rounded-lg p-4 overflow-x-auto hide-scrollbar flex gap-4">
                    <div id="stories-container" class="flex gap-4"></div>
                </div>
                <div id="feed-posts-container" class="space-y-6"></div>
            </div>

            <!-- VIEW 2: EXPLORE / SEARCH -->
            <div id="view-explore" class="hidden max-w-4xl mx-auto py-4 px-2 md:px-4">
                <div class="mb-4 flex gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="explore-search-input" onkeyup="filterExplore()" placeholder="검색 (#해시태그, 아이디, 키워드)..." class="w-full bg-gray-100 pl-10 pr-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-gray-300">
                    </div>
                    <button onclick="renderExploreGrid()" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg text-xs font-semibold text-gray-600 flex items-center gap-1">
                        <i class="fa-solid fa-rotate"></i> 새로고침
                    </button>
                </div>
                <div id="explore-grid-container" class="explore-grid"></div>
            </div>

            <!-- VIEW 3: DM -->
            <div id="view-dm" class="hidden max-w-3xl mx-auto py-4 px-2 md:px-4">
                <div class="bg-white border rounded-lg h-[80vh] flex overflow-hidden shadow-sm">
                    <div class="w-1/3 border-r border-gray-200 flex flex-col">
                        <div class="p-4 border-b font-semibold text-sm flex justify-between items-center">
                            <span>대화 상대</span>
                            <span class="text-xs text-pink-600">현재: @<span id="dm-current-account-label"></span></span>
                        </div>
                        <div id="dm-conversations-list" class="flex-1 overflow-y-auto divide-y divide-gray-100"></div>
                    </div>
                    <div class="w-2/3 flex flex-col bg-gray-50">
                        <div id="dm-chat-header" class="p-4 bg-white border-b flex items-center gap-3">
                            <img id="dm-header-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                            <span id="dm-header-username" class="font-semibold text-sm">상대방을 선택하세요</span>
                        </div>
                        <div id="dm-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col"></div>
                        <form onsubmit="handleSendDm(event)" class="p-3 bg-white border-t flex flex-col gap-2">
                            <div class="flex gap-2">
                                <input type="text" id="dm-input-text" placeholder="메시지 보내기..." class="flex-1 border rounded-full px-4 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-pink-500">
                                <button type="submit" class="text-sm font-semibold text-pink-600 px-3">전송</button>
                            </div>
                            <div class="flex items-center gap-2 text-xs text-gray-500 px-2">
                                <span>보낸 시간 표기:</span>
                                <input type="text" id="dm-input-time" value="오후 10:14" class="border rounded px-2 py-0.5 w-28 text-xs">
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- VIEW 4: PROFILE -->
            <div id="view-profile" class="hidden max-w-4xl mx-auto py-6 px-4">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-12 mb-6 border-b border-gray-200 pb-6">
                    <div class="w-24 h-24 sm:w-36 sm:h-36 rounded-full p-1 story-ring cursor-pointer" onclick="openProfileStory()">
                        <img id="profile-avatar" src="" class="w-full h-full object-cover rounded-full border-2 border-white">
                    </div>

                    <div class="flex-1 text-center sm:text-left space-y-4">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-4">
                            <h2 id="profile-username" class="text-xl font-normal">username</h2>
                            <div class="flex gap-2 justify-center">
                                <button onclick="openEditProfileModal()" id="admin-edit-profile-btn" class="hidden px-4 py-1.5 bg-gray-100 hover:bg-gray-200 font-semibold text-sm rounded-lg transition">
                                    프로필 편집 (관리자)
                                </button>
                                <button onclick="handleToggleFollow()" id="profile-follow-btn" class="px-4 py-1.5 bg-sky-500 hover:bg-sky-600 text-white font-semibold text-sm rounded-lg transition">
                                    팔로우
                                </button>
                            </div>
                        </div>

                        <div class="flex justify-center sm:justify-start gap-8 text-sm">
                            <div>게시물 <span id="profile-posts-count" class="font-semibold">0</span></div>
                            <div onclick="openRelationshipsModal('followers')" class="cursor-pointer hover:underline">팔로워 <span id="profile-followers-count" class="font-semibold">0</span></div>
                            <div onclick="openRelationshipsModal('following')" class="cursor-pointer hover:underline">팔로잉 <span id="profile-following-count" class="font-semibold">0</span></div>
                        </div>

                        <div class="text-sm space-y-1">
                            <div id="profile-fullname" class="font-semibold">Full Name</div>
                            <div id="profile-bio" class="whitespace-pre-line text-gray-700">Bio content...</div>
                        </div>
                    </div>
                </div>

                <!-- Story Highlights (스토리 보관함) Section -->
                <div class="mb-8 border-b border-gray-200 pb-6">
                    <h3 class="text-xs font-semibold text-gray-400 mb-3 uppercase tracking-wider">스토리 보관함 (하이라이트)</h3>
                    <div id="profile-story-highlights" class="flex gap-4 overflow-x-auto hide-scrollbar">
                        <!-- User's saved stories dynamically placed here -->
                    </div>
                </div>

                <div id="profile-posts-grid" class="grid grid-cols-3 gap-1 sm:gap-4"></div>
            </div>
        </main>

        <!-- Mobile Bottom Nav -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3 z-30">
            <button onclick="switchTab('feed')" class="text-xl text-gray-700"><i class="fa-solid fa-house"></i></button>
            <button onclick="switchTab('explore')" class="text-xl text-gray-700"><i class="fa-solid fa-compass"></i></button>
            <button onclick="switchTab('dm')" class="text-xl text-gray-700"><i class="fa-regular fa-paper-plane"></i></button>
            <button onclick="openNewPostModal()" id="admin-create-btn-bottom" class="hidden text-xl text-pink-600"><i class="fa-regular fa-square-plus"></i></button>
            <button onclick="viewProfile(currentAccount)" class="w-6 h-6 rounded-full overflow-hidden border border-gray-300">
                <img id="mobile-nav-avatar" src="" class="w-full h-full object-cover">
            </button>
        </nav>
    </div>

    <!-- STORY VIEWER MODAL -->
    <div id="modal-story-viewer" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-2">
        <div class="relative w-full max-w-sm h-[85vh] bg-gray-900 rounded-2xl overflow-hidden flex flex-col justify-between p-4 border border-gray-800">
            <!-- Story Header -->
            <div class="flex items-center justify-between text-white z-10">
                <div class="flex items-center gap-2">
                    <img id="story-view-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                    <span id="story-view-username" class="font-semibold text-sm">username</span>
                    <span id="story-view-time" class="text-xs text-gray-300 ml-1">시간</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="admin-story-edit-btn" onclick="openEditStoryModal()" class="hidden text-amber-400 text-sm font-semibold px-2 py-1 bg-amber-950/60 rounded">수정/삭제</button>
                    <button onclick="closeModal('modal-story-viewer')" class="text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Story Image -->
            <div class="absolute inset-0 flex items-center justify-center">
                <img id="story-view-img" src="" class="w-full h-full object-cover">
            </div>

            <!-- Reaction List Overlay -->
            <div id="story-reactions-display" class="relative z-10 bg-black/50 text-white text-xs p-2 rounded-lg max-h-20 overflow-y-auto hide-scrollbar space-y-1">
                <!-- Reactions inserted dynamically -->
            </div>

            <!-- Emoji Reaction Bar -->
            <div class="relative z-10 bg-black/40 backdrop-blur-md rounded-full px-4 py-2 flex justify-around text-xl text-white">
                <button onclick="sendStoryEmoji('❤️')">❤️</button>
                <button onclick="sendStoryEmoji('🔥')">🔥</button>
                <button onclick="sendStoryEmoji('😂')">😂</button>
                <button onclick="sendStoryEmoji('😮')">😮</button>
                <button onclick="sendStoryEmoji('😢')">😢</button>
                <button onclick="sendStoryEmoji('👏')">👏</button>
            </div>
            <div id="story-emoji-float" class="absolute inset-0 pointer-events-none z-20 overflow-hidden"></div>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT STORY -->
    <div id="modal-new-story" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="story-modal-title" class="font-bold">새 스토리 올리기</h3>
                <button onclick="closeModal('modal-new-story')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleSaveStory(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">캐릭터 계정</label>
                    <select id="story-author-select" class="w-full border rounded-lg p-2 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">스토리 사진 파일 첨부</label>
                    <input type="file" id="story-image-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">업로드 시간 표기</label>
                    <input type="text" id="story-time-input" value="3시간 전" placeholder="예: 방금 전, 10분 전" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="story-delete-btn" onclick="handleDeleteCurrentStory()" class="hidden py-2 px-4 bg-red-100 text-red-600 rounded-lg text-xs font-semibold hover:bg-red-200">🗑️ 삭제</button>
                    <button type="submit" class="flex-1 py-2 bg-amber-500 text-white rounded-lg font-semibold hover:bg-amber-600">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: CREATE / EDIT POST -->
    <div id="modal-new-post" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 space-y-4 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="post-modal-title" class="font-bold">새 피드 올리기</h3>
                <button onclick="closeModal('modal-new-post')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleSavePost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">작성 계정</label>
                    <select id="post-author-select" class="w-full border rounded-lg p-2 text-sm bg-white"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">사진 파일 첨부</label>
                    <input type="file" id="post-image-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">본문 내용 (@태그, #해시태그)</label>
                    <textarea id="post-caption" rows="3" class="w-full border rounded-lg p-2 text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">좋아요 수</label>
                        <input type="number" id="post-likes" value="124" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">작성 시간</label>
                        <input type="text" id="post-time" value="방금 전" class="w-full border rounded-lg p-2 text-sm">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button type="button" id="post-delete-btn" onclick="handleDeleteCurrentPost()" class="hidden py-2.5 px-4 bg-red-100 text-red-600 rounded-lg text-xs font-semibold hover:bg-red-200">🗑️ 삭제</button>
                    <button type="submit" class="flex-1 py-2.5 bg-pink-600 text-white rounded-lg font-semibold hover:bg-pink-700">게시물 저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: ADMIN LOGIN -->
    <div id="modal-admin" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 space-y-4 shadow-xl">
            <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-user-shield text-pink-500"></i> 작가 관리자 로그인</h3>
            <div>
                <label class="block text-xs font-semibold text-gray-500 mb-1">관리자 비밀번호</label>
                <input type="password" id="admin-password-input" placeholder="기본 비밀번호: 1234" class="w-full border rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
            </div>
            <div class="flex gap-2">
                <button onclick="toggleAdminModal()" class="flex-1 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-semibold">취소</button>
                <button onclick="loginAdmin()" class="flex-1 py-2 bg-pink-500 text-white rounded-lg text-sm font-semibold hover:bg-pink-600">확인</button>
            </div>
        </div>
    </div>

    <!-- MODAL: CREATE ACCOUNT -->
    <div id="modal-new-account" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold">새 캐릭터 추가</h3>
                <button onclick="closeModal('modal-new-account')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleCreateAccount(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">아이디 (Username)</label>
                    <input type="text" id="new-acc-username" required placeholder="minho_lee" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">이름 (Full Name)</label>
                    <input type="text" id="new-acc-fullname" required placeholder="이민호" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">프로필 사진 파일 첨부</label>
                    <input type="file" id="new-acc-avatar-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">소개글 (Bio)</label>
                    <textarea id="new-acc-bio" rows="2" class="w-full border rounded-lg p-2 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full py-2 bg-purple-600 text-white rounded-lg font-semibold hover:bg-purple-700">캐릭터 생성</button>
            </form>
        </div>
    </div>

    <!-- MODAL: EDIT PROFILE & DELETE ACCOUNT -->
    <div id="modal-edit-profile" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold">프로필 편집 및 관리</h3>
                <button onclick="closeModal('modal-edit-profile')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form onsubmit="handleSaveProfile(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">아이디 (Username)</label>
                    <input type="text" id="edit-username" required class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">이름 (Full Name)</label>
                    <input type="text" id="edit-fullname" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">새 프로필 사진 파일로 변경</label>
                    <input type="file" id="edit-avatar-file" accept="image/*" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-pink-50 file:text-pink-700 hover:file:bg-pink-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">소개글 (Bio)</label>
                    <textarea id="edit-bio" rows="3" class="w-full border rounded-lg p-2 text-sm"></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="handleDeleteCurrentAccount()" class="py-2 px-4 bg-red-100 text-red-600 rounded-lg text-xs font-semibold hover:bg-red-200">🗑️ 캐릭터 삭제</button>
                    <button type="submit" class="flex-1 py-2 bg-pink-600 text-white rounded-lg text-sm font-semibold hover:bg-pink-700">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: POST DETAIL -->
    <div id="modal-post-detail" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-xl max-w-3xl w-full flex flex-col md:flex-row overflow-hidden max-h-[90vh]">
            <div class="bg-black md:w-3/5 flex items-center justify-center min-h-[300px]">
                <img id="detail-img" src="" class="max-h-[70vh] object-contain w-full">
            </div>
            <div class="md:w-2/5 flex flex-col p-4 bg-white">
                <div class="flex items-center justify-between border-b pb-3">
                    <div class="flex items-center gap-3">
                        <img id="detail-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                        <span id="detail-username" class="font-semibold text-sm cursor-pointer hover:underline" onclick="closeModal('modal-post-detail')">username</span>
                    </div>
                    <button id="admin-post-edit-btn" onclick="openEditPostModalFromDetail()" class="hidden text-xs bg-gray-100 px-2 py-1 rounded text-gray-600">수정/삭제</button>
                </div>
                <div class="flex-1 overflow-y-auto py-3 space-y-3 text-sm border-b">
                    <div id="detail-caption" class="text-gray-800 whitespace-pre-line"></div>
                    <div id="detail-comments-list" class="space-y-2 pt-2 border-t"></div>
                </div>
                <div class="pt-3 space-y-2">
                    <div class="flex items-center gap-4 text-xl">
                        <button onclick="toggleDetailLike()"><i id="detail-like-btn" class="fa-regular fa-heart"></i></button>
                    </div>
                    <div id="detail-likes-count" class="font-semibold text-xs">좋아요 0개</div>
                    <form onsubmit="handleAddDetailComment(event)" class="flex gap-2 pt-2">
                        <input type="text" id="detail-comment-input" placeholder="댓글 달기..." class="flex-1 text-xs border rounded-lg px-2 py-1.5 focus:outline-none">
                        <button type="submit" class="text-xs font-semibold text-pink-600">게시</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: RELATIONSHIPS -->
    <div id="modal-relationships" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-xs w-full p-4 space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="rel-modal-title" class="font-bold text-sm">목록</h3>
                <button onclick="closeModal('modal-relationships')" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="rel-modal-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const INITIAL_DATA = {
            isAdmin: false,
            adminPass: '1234',
            currentAccount: 'san_choi',
            activeDmTarget: 'wooyoung_j',
            accounts: {
                'san_choi': {
                    username: 'san_choi',
                    fullName: '최산',
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
                    bio: 'ATEEZ / 🐱 산덕이\n"기억은 계절을 타고 흐른다."',
                    followers: ['wooyoung_j'],
                    following: ['wooyoung_j']
                },
                'wooyoung_j': {
                    username: 'wooyoung_j',
                    fullName: '정우영',
                    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80',
                    bio: 'ATEEZ / 🐈‍⬛ 우요냥\nMain Dancer. @san_choi',
                    followers: ['san_choi'],
                    following: ['san_choi']
                }
            },
            stories: [
                {
                    id: 's1',
                    author: 'san_choi',
                    image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=80',
                    time: '2시간 전',
                    reactions: [{ sender: 'wooyoung_j', emoji: '🔥' }]
                }
            ],
            posts: [
                {
                    id: 'p1',
                    author: 'san_choi',
                    image: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&auto=format&fit=crop&q=80',
                    caption: '연습 끝나고 오랫만에 카페. @wooyoung_j #일상 #카페 ☕️',
                    likes: 342,
                    likedByMe: false,
                    time: '3시간 전',
                    comments: [{ author: 'wooyoung_j', text: '다음엔 내가 사줄게 ㅋㅋㅋ #카페' }]
                }
            ],
            dms: {
                'san_choi_wooyoung_j': [
                    { sender: 'wooyoung_j', text: '산아 연습 마치고 카페 가냐?', time: '오후 08:10' },
                    { sender: 'san_choi', text: '응 왜?', time: '오후 08:12' }
                ]
            }
        };

        let store = JSON.parse(localStorage.getItem('teezgram_v4_store')) || INITIAL_DATA;
        let activeTab = 'feed';
        let activeProfileId = 'san_choi';
        let currentDetailPostId = null;
        let currentViewingStory = null;
        let editingPostId = null;
        let editingStoryId = null;

        function saveStore() {
            localStorage.setItem('teezgram_v4_store', JSON.stringify(store));
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderAccountSwitcher();
            renderStories();
            switchTab('feed');
            updateAdminUI();
        });

        // ADMIN LOGIN
        function toggleAdminModal() {
            if (store.isAdmin) {
                store.isAdmin = false;
                saveStore();
                updateAdminUI();
                alert('독자 모드로 전환되었습니다.');
            } else {
                document.getElementById('modal-admin').classList.remove('hidden');
            }
        }

        function loginAdmin() {
            if (document.getElementById('admin-password-input').value === store.adminPass) {
                store.isAdmin = true;
                saveStore();
                updateAdminUI();
                closeModal('modal-admin');
                document.getElementById('admin-password-input').value = '';
                alert('관리자 로그인 성공!');
            } else alert('비밀번호가 올바르지 않습니다.');
        }

        function updateAdminUI() {
            const adminBtns = [
                'admin-create-btn-side', 'admin-create-btn-top', 'admin-create-btn-bottom',
                'admin-create-account-btn-side', 'admin-story-btn-side', 'admin-edit-profile-btn'
            ];
            adminBtns.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('hidden', !store.isAdmin);
            });

            document.getElementById('admin-status-text').innerText = store.isAdmin ? '관리자 모드 중 (클릭시 잠금)' : '독자 모드 (클릭하여 작가 로그인)';
            document.getElementById('admin-lock-icon').className = store.isAdmin ? 'fa-solid fa-unlock text-pink-500' : 'fa-solid fa-lock';
            
            const storyEditBtn = document.getElementById('admin-story-edit-btn');
            if (storyEditBtn) storyEditBtn.classList.toggle('hidden', !store.isAdmin);

            const postEditBtn = document.getElementById('admin-post-edit-btn');
            if (postEditBtn) postEditBtn.classList.toggle('hidden', !store.isAdmin);
        }

        // TABS
        function switchTab(tab) {
            activeTab = tab;
            ['feed', 'explore', 'dm', 'profile'].forEach(t => {
                document.getElementById('view-' + t).classList.add('hidden');
            });
            document.getElementById('view-' + tab).classList.remove('hidden');

            if (tab === 'feed') renderFeed();
            else if (tab === 'explore') renderExploreGrid();
            else if (tab === 'dm') renderDmView();
            else if (tab === 'profile') renderProfile(activeProfileId);
            window.scrollTo(0,0);
        }

        // FEED
        function renderFeed() {
            const container = document.getElementById('feed-posts-container');
            container.innerHTML = '';
            store.posts.forEach(post => {
                const authorAcc = store.accounts[post.author] || { username: post.author, avatar: '' };
                const card = document.createElement('article');
                card.className = 'bg-white border md:border-gray-200 md:rounded-lg overflow-hidden';
                card.innerHTML = `
                    <div class="flex items-center justify-between p-3 border-b border-gray-100">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="viewProfile('${authorAcc.username}')">
                            <img src="${authorAcc.avatar}" class="w-8 h-8 rounded-full object-cover">
                            <span class="font-semibold text-sm hover:underline">${authorAcc.username}</span>
                        </div>
                        ${store.isAdmin ? `<button onclick="openEditPostModal('${post.id}')" class="text-gray-500 px-2"><i class="fa-solid fa-ellipsis"></i></button>` : ''}
                    </div>
                    <div class="bg-black flex items-center justify-center max-h-[500px]">
                        <img src="${post.image}" class="w-full object-cover max-h-[500px]" onclick="openPostDetail('${post.id}')">
                    </div>
                    <div class="p-3 space-y-2">
                        <div class="flex gap-4 text-xl">
                            <button onclick="toggleLike('${post.id}')"><i class="${post.likedByMe ? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart'}"></i></button>
                            <button onclick="openPostDetail('${post.id}')"><i class="fa-regular fa-comment"></i></button>
                        </div>
                        <div class="font-semibold text-xs">좋아요 ${post.likes}개</div>
                        <div class="text-sm"><b>${authorAcc.username}</b> ${formatMentionsAndTags(post.caption)}</div>
                        <div class="text-[10px] text-gray-400 uppercase">${post.time}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // EXPLORE
        function renderExploreGrid() {
            const container = document.getElementById('explore-grid-container');
            container.innerHTML = '';
            store.posts.forEach(item => {
                const el = document.createElement('div');
                el.className = 'relative group cursor-pointer overflow-hidden bg-gray-200 aspect-square';
                el.innerHTML = `<img src="${item.image}" class="w-full h-full object-cover">`;
                el.onclick = () => openPostDetail(item.id);
                container.appendChild(el);
            });
        }

        function filterExplore() {
            const query = document.getElementById('explore-search-input').value.toLowerCase();
            const items = document.querySelectorAll('#explore-grid-container > div');
            items.forEach(el => {
                el.style.display = el.innerText.toLowerCase().includes(query) || query === '' ? 'block' : 'none';
            });
        }

        function searchHashtag(tag) {
            switchTab('explore');
            const searchInput = document.getElementById('explore-search-input');
            if (searchInput) {
                searchInput.value = '#' + tag;
                filterExplore();
            }
        }

        // STORIES & HIGHLIGHTS
        function renderStories() {
            const container = document.getElementById('stories-container');
            container.innerHTML = '';
            Object.values(store.accounts).forEach(acc => {
                const userStory = store.stories.find(s => s.author === acc.username);
                const div = document.createElement('div');
                div.className = 'flex flex-col items-center space-y-1 cursor-pointer min-w-[64px]';
                div.onclick = () => {
                    if (userStory) openStoryViewer(userStory);
                    else viewProfile(acc.username);
                };
                div.innerHTML = `
                    <div class="w-16 h-16 rounded-full p-[2px] ${userStory ? 'story-ring' : 'border border-gray-300'}">
                        <img src="${acc.avatar}" class="w-full h-full object-cover rounded-full border-2 border-white">
                    </div>
                    <span class="text-xs text-gray-600 truncate w-16 text-center">${acc.username}</span>
                `;
                container.appendChild(div);
            });
        }

        function openProfileStory() {
            const userStory = store.stories.find(s => s.author === activeProfileId);
            if (userStory) {
                openStoryViewer(userStory);
            } else {
                alert('현재 남아있는 실시간 스토리가 없습니다. 하단 보관함에서 지났던 스토리를 확인해보세요!');
            }
        }

        function openStoryViewer(story) {
            currentViewingStory = story;
            const acc = store.accounts[story.author] || { username: story.author, avatar: '' };
            document.getElementById('story-view-avatar').src = acc.avatar;
            document.getElementById('story-view-username').innerText = acc.username;
            document.getElementById('story-view-time').innerText = story.time;
            document.getElementById('story-view-img').src = story.image;

            renderStoryReactions();
            updateAdminUI();
            document.getElementById('modal-story-viewer').classList.remove('hidden');
        }

        function renderStoryReactions() {
            if (!currentViewingStory) return;
            const container = document.getElementById('story-reactions-display');
            const reactions = currentViewingStory.reactions || [];
            if (reactions.length === 0) {
                container.innerHTML = `<div class="text-gray-400 text-center text-[11px]">남겨진 반응이 없습니다.</div>`;
            } else {
                container.innerHTML = reactions.map(r => `
                    <div class="flex items-center justify-between"><span class="font-semibold cursor-pointer hover:underline" onclick="closeModal('modal-story-viewer'); viewProfile('${r.sender}')">@${r.sender}</span><span>${r.emoji}</span></div>
                `).join('');
            }
        }

        function sendStoryEmoji(emoji) {
            if (!currentViewingStory) return;
            if (!currentViewingStory.reactions) currentViewingStory.reactions = [];

            currentViewingStory.reactions.unshift({
                sender: store.currentAccount,
                emoji: emoji
            });

            saveStore();
            renderStoryReactions();

            const container = document.getElementById('story-emoji-float');
            const el = document.createElement('div');
            el.innerText = emoji;
            el.className = 'absolute text-4xl animate-bounce';
            el.style.left = Math.random() * 80 + 10 + '%';
            el.style.bottom = '20%';
            container.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function openNewStoryModal() {
            if (!store.isAdmin) return;
            editingStoryId = null;
            document.getElementById('story-modal-title').innerText = '새 스토리 올리기';
            document.getElementById('story-delete-btn').classList.add('hidden');
            document.getElementById('modal-new-story').classList.remove('hidden');
        }

        function openEditStoryModal() {
            if (!currentViewingStory || !store.isAdmin) return;
            editingStoryId = currentViewingStory.id;
            document.getElementById('story-modal-title').innerText = '스토리 수정/삭제';
            document.getElementById('story-author-select').value = currentViewingStory.author;
            document.getElementById('story-time-input').value = currentViewingStory.time;
            document.getElementById('story-delete-btn').classList.remove('hidden');
            document.getElementById('modal-new-story').classList.remove('hidden');
        }

        function handleSaveStory(e) {
            e.preventDefault();
            const author = document.getElementById('story-author-select').value;
            const fileInput = document.getElementById('story-image-file');
            const time = document.getElementById('story-time-input').value.trim() || '방금 전';

            const processSave = (imgSrc) => {
                if (editingStoryId) {
                    const story = store.stories.find(s => s.id === editingStoryId);
                    if (story) {
                        story.author = author;
                        story.time = time;
                        if (imgSrc) story.image = imgSrc;
                    }
                } else {
                    store.stories.unshift({ id: 's_' + Date.now(), author, image: imgSrc || 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600', time, reactions: [] });
                }
                saveStore();
                renderStories();
                if (activeTab === 'profile') renderProfile(activeProfileId);
                closeModal('modal-new-story');
                closeModal('modal-story-viewer');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (evt) => processSave(evt.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else processSave(null);
        }

        function handleDeleteCurrentStory() {
            if (!editingStoryId || !store.isAdmin) return;
            if (confirm('이 스토리를 삭제하시겠습니까?')) {
                store.stories = store.stories.filter(s => s.id !== editingStoryId);
                saveStore();
                renderStories();
                if (activeTab === 'profile') renderProfile(activeProfileId);
                closeModal('modal-new-story');
                closeModal('modal-story-viewer');
            }
        }

        // FOLLOW SYSTEM
        function handleToggleFollow() {
            const currentAcc = store.accounts[store.currentAccount];
            const targetAcc = store.accounts[activeProfileId];
            if (!currentAcc || !targetAcc || store.currentAccount === activeProfileId) return;

            if (!currentAcc.following) currentAcc.following = [];
            if (!targetAcc.followers) targetAcc.followers = [];

            const isFollowing = currentAcc.following.includes(activeProfileId);

            if (isFollowing) {
                currentAcc.following = currentAcc.following.filter(u => u !== activeProfileId);
                targetAcc.followers = targetAcc.followers.filter(u => u !== store.currentAccount);
            } else {
                currentAcc.following.push(activeProfileId);
                targetAcc.followers.push(store.currentAccount);
            }

            saveStore();
            renderProfile(activeProfileId);
        }

        // PROFILE & HIGHLIGHTS
        function viewProfile(username) { activeProfileId = username; switchTab('profile'); }

        function renderProfile(username) {
            const acc = store.accounts[username] || { username, fullName: username, avatar: '', bio: '', followers: [], following: [] };
            document.getElementById('profile-avatar').src = acc.avatar;
            document.getElementById('profile-username').innerText = acc.username;
            document.getElementById('profile-fullname').innerText = acc.fullName;
            document.getElementById('profile-bio').innerText = acc.bio;

            const userPosts = store.posts.filter(p => p.author === username);
            document.getElementById('profile-posts-count').innerText = userPosts.length;
            document.getElementById('profile-followers-count').innerText = acc.followers ? acc.followers.length : 0;
            document.getElementById('profile-following-count').innerText = acc.following ? acc.following.length : 0;

            const followBtn = document.getElementById('profile-follow-btn');
            if (username === store.currentAccount) {
                followBtn.classList.add('hidden');
            } else {
                followBtn.classList.remove('hidden');
                const isFollowing = (store.accounts[store.currentAccount].following || []).includes(username);
                followBtn.innerText = isFollowing ? '팔로잉' : '팔로우';
                followBtn.className = isFollowing ? 'px-4 py-1.5 bg-gray-200 text-gray-800 font-semibold text-sm rounded-lg transition' : 'px-4 py-1.5 bg-sky-500 hover:bg-sky-600 text-white font-semibold text-sm rounded-lg transition';
            }

            // Render Highlights (Saved Stories)
            const userStories = store.stories.filter(s => s.author === username);
            const highlightContainer = document.getElementById('profile-story-highlights');
            highlightContainer.innerHTML = '';

            if (userStories.length === 0) {
                highlightContainer.innerHTML = `<div class="text-xs text-gray-400 italic">보관된 스토리가 없습니다.</div>`;
            } else {
                userStories.forEach((st, idx) => {
                    const item = document.createElement('div');
                    item.className = 'flex flex-col items-center space-y-1 cursor-pointer min-w-[56px]';
                    item.onclick = () => openStoryViewer(st);
                    item.innerHTML = `
                        <div class="w-14 h-14 rounded-full p-[2px] border-2 border-gray-300">
                            <img src="${st.image}" class="w-full h-full object-cover rounded-full">
                        </div>
                        <span class="text-[10px] text-gray-600 truncate w-14 text-center">스토리 ${idx + 1}</span>
                    `;
                    highlightContainer.appendChild(item);
                });
            }

            const grid = document.getElementById('profile-posts-grid');
            grid.innerHTML = '';
            userPosts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'aspect-square relative group cursor-pointer overflow-hidden bg-gray-100';
                item.innerHTML = `<img src="${post.image}" class="w-full h-full object-cover">`;
                item.onclick = () => openPostDetail(post.id);
                grid.appendChild(item);
            });
        }

        function handleDeleteCurrentAccount() {
            if (!store.isAdmin) return;
            if (Object.keys(store.accounts).length <= 1) {
                alert('최소 1개의 캐릭터 계정은 존재해야 합니다.');
                return;
            }
            if (confirm(`정말로 @${activeProfileId} 캐릭터 계정을 삭제하시겠습니까?`)) {
                delete store.accounts[activeProfileId];
                store.posts = store.posts.filter(p => p.author !== activeProfileId);
                store.stories = store.stories.filter(s => s.author !== activeProfileId);
                
                const remainingAccs = Object.keys(store.accounts);
                store.currentAccount = remainingAccs[0];
                activeProfileId = remainingAccs[0];

                saveStore();
                renderAccountSwitcher();
                renderStories();
                closeModal('modal-edit-profile');
                viewProfile(activeProfileId);
            }
        }

        function openEditProfileModal() {
            const acc = store.accounts[activeProfileId];
            if (!acc) return;
            document.getElementById('edit-username').value = acc.username;
            document.getElementById('edit-fullname').value = acc.fullName || '';
            document.getElementById('edit-bio').value = acc.bio || '';
            document.getElementById('modal-edit-profile').classList.remove('hidden');
        }

        function handleSaveProfile(e) {
            e.preventDefault();
            const newUsername = document.getElementById('edit-username').value.trim().toLowerCase();
            const fullName = document.getElementById('edit-fullname').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const fileInput = document.getElementById('edit-avatar-file');

            const applyChanges = (avatarSrc) => {
                const oldUsername = activeProfileId;
                const acc = store.accounts[oldUsername];
                
                if (newUsername !== oldUsername) {
                    store.accounts[newUsername] = { username: newUsername, fullName, avatar: avatarSrc || acc.avatar, bio, followers: acc.followers, following: acc.following };
                    delete store.accounts[oldUsername];
                    store.posts.forEach(p => { if (p.author === oldUsername) p.author = newUsername; });
                    store.stories.forEach(s => { if (s.author === oldUsername) s.author = newUsername; });
                    if (store.currentAccount === oldUsername) store.currentAccount = newUsername;
                    activeProfileId = newUsername;
                } else {
                    acc.fullName = fullName;
                    acc.bio = bio;
                    if (avatarSrc) acc.avatar = avatarSrc;
                }

                saveStore();
                renderAccountSwitcher();
                renderStories();
                renderProfile(activeProfileId);
                closeModal('modal-edit-profile');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (evt) => applyChanges(evt.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else applyChanges(null);
        }

        // POST CREATE & EDIT & DELETE
        function openNewPostModal() {
            if (!store.isAdmin) return;
            editingPostId = null;
            document.getElementById('post-modal-title').innerText = '새 피드 올리기';
            document.getElementById('post-delete-btn').classList.add('hidden');
            document.getElementById('post-caption').value = '';
            document.getElementById('modal-new-post').classList.remove('hidden');
        }

        function openEditPostModal(postId) {
            if (!store.isAdmin) return;
            const post = store.posts.find(p => p.id === postId);
            if (!post) return;
            editingPostId = postId;
            document.getElementById('post-modal-title').innerText = '게시물 수정/삭제';
            document.getElementById('post-author-select').value = post.author;
            document.getElementById('post-caption').value = post.caption;
            document.getElementById('post-likes').value = post.likes;
            document.getElementById('post-time').value = post.time;
            document.getElementById('post-delete-btn').classList.remove('hidden');
            document.getElementById('modal-new-post').classList.remove('hidden');
        }

        function openEditPostModalFromDetail() {
            if (currentDetailPostId) {
                closeModal('modal-post-detail');
                openEditPostModal(currentDetailPostId);
            }
        }

        function handleSavePost(e) {
            e.preventDefault();
            const author = document.getElementById('post-author-select').value;
            const caption = document.getElementById('post-caption').value.trim();
            const likes = parseInt(document.getElementById('post-likes').value) || 100;
            const time = document.getElementById('post-time').value.trim() || '방금 전';
            const fileInput = document.getElementById('post-image-file');

            const processSave = (imgSrc) => {
                if (editingPostId) {
                    const post = store.posts.find(p => p.id === editingPostId);
                    if (post) {
                        post.author = author;
                        post.caption = caption;
                        post.likes = likes;
                        post.time = time;
                        if (imgSrc) post.image = imgSrc;
                    }
                } else {
                    store.posts.unshift({ id: 'p_' + Date.now(), author, image: imgSrc || 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600', caption, likes, likedByMe: false, time, comments: [] });
                }
                saveStore();
                closeModal('modal-new-post');
                switchTab('feed');
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (evt) => processSave(evt.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else processSave(null);
        }

        function handleDeleteCurrentPost() {
            if (!editingPostId || !store.isAdmin) return;
            if (confirm('이 게시글을 삭제하시겠습니까?')) {
                store.posts = store.posts.filter(p => p.id !== editingPostId);
                saveStore();
                closeModal('modal-new-post');
                switchTab('feed');
            }
        }

        // CREATE ACCOUNT
        function openNewAccountModal() {
            if (!store.isAdmin) return;
            document.getElementById('modal-new-account').classList.remove('hidden');
        }

        function handleCreateAccount(e) {
            e.preventDefault();
            const username = document.getElementById('new-acc-username').value.trim().toLowerCase();
            const fullName = document.getElementById('new-acc-fullname').value.trim();
            const bio = document.getElementById('new-acc-bio').value.trim();
            const fileInput = document.getElementById('new-acc-avatar-file');

            const saveAndClose = (avatarSrc) => {
                store.accounts[username] = { username, fullName, avatar: avatarSrc, bio, followers: [], following: [] };
                saveStore();
                renderAccountSwitcher();
                renderStories();
                closeModal('modal-new-account');
                viewProfile(username);
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (evt) => saveAndClose(evt.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else saveAndClose('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150');
        }

        // DM & ACCOUNT SWITCHER
        function renderDmView() {
            document.getElementById('dm-current-account-label').innerText = store.currentAccount;
            const listContainer = document.getElementById('dm-conversations-list');
            listContainer.innerHTML = '';

            Object.values(store.accounts).forEach(acc => {
                if (acc.username === store.currentAccount) return;
                const item = document.createElement('div');
                item.className = `flex items-center gap-3 p-3 cursor-pointer hover:bg-gray-50 ${store.activeDmTarget === acc.username ? 'bg-pink-50' : ''}`;
                item.onclick = () => { store.activeDmTarget = acc.username; renderDmView(); };
                item.innerHTML = `<img src="${acc.avatar}" class="w-10 h-10 rounded-full object-cover"><div><div class="font-semibold text-sm">${acc.username}</div></div>`;
                listContainer.appendChild(item);
            });

            const targetAcc = store.accounts[store.activeDmTarget];
            if (targetAcc) {
                document.getElementById('dm-header-avatar').src = targetAcc.avatar;
                document.getElementById('dm-header-username').innerText = targetAcc.username;

                const msgContainer = document.getElementById('dm-messages-container');
                msgContainer.innerHTML = '';

                const k1 = `${store.currentAccount}_${store.activeDmTarget}`;
                const k2 = `${store.activeDmTarget}_${store.currentAccount}`;
                let messages = store.dms[k1] || store.dms[k2] || [];

                messages.forEach(m => {
                    const isMe = m.sender === store.currentAccount;
                    const bubble = document.createElement('div');
                    bubble.className = `max-w-[70%] p-3 rounded-lg text-sm ${isMe ? 'bg-pink-600 text-white ml-auto rounded-br-none' : 'bg-white border text-gray-800 mr-auto rounded-bl-none'}`;
                    bubble.innerHTML = `<div>${m.text}</div><div class="text-[9px] ${isMe ? 'text-pink-200' : 'text-gray-400'} mt-1 text-right">${m.time || ''}</div>`;
                    msgContainer.appendChild(bubble);
                });
                msgContainer.scrollTop = msgContainer.scrollHeight;
            }
        }

        function handleSendDm(e) {
            e.preventDefault();
            const text = document.getElementById('dm-input-text').value.trim();
            const time = document.getElementById('dm-input-time').value.trim();
            if (!text || !store.activeDmTarget) return;

            const k1 = `${store.currentAccount}_${store.activeDmTarget}`;
            const k2 = `${store.activeDmTarget}_${store.currentAccount}`;
            if (!store.dms[k1] && !store.dms[k2]) store.dms[k1] = [];
            const key = store.dms[k1] ? k1 : k2;

            store.dms[key].push({ sender: store.currentAccount, text, time });
            saveStore();
            document.getElementById('dm-input-text').value = '';
            renderDmView();
        }

        function renderAccountSwitcher() {
            const container = document.getElementById('account-switcher');
            const selectPost = document.getElementById('post-author-select');
            const selectStory = document.getElementById('story-author-select');
            container.innerHTML = '';
            selectPost.innerHTML = '';
            selectStory.innerHTML = '';

            Object.values(store.accounts).forEach(acc => {
                const btn = document.createElement('button');
                btn.className = `w-full flex items-center gap-2 p-2 rounded-lg text-left text-xs ${store.currentAccount === acc.username ? 'bg-pink-50 text-pink-600 font-semibold' : 'hover:bg-gray-50'}`;
                btn.onclick = () => {
                    store.currentAccount = acc.username;
                    saveStore();
                    renderAccountSwitcher();
                    if (activeTab === 'profile') renderProfile(activeProfileId);
                    else if (activeTab === 'dm') renderDmView();
                };
                btn.innerHTML = `<img src="${acc.avatar}" class="w-5 h-5 rounded-full object-cover"><span class="truncate">${acc.username}</span>`;
                container.appendChild(btn);

                const opt = `<option value="${acc.username}">@${acc.username} (${acc.fullName})</option>`;
                selectPost.innerHTML += opt;
                selectStory.innerHTML += opt;
            });

            const cur = store.accounts[store.currentAccount] || Object.values(store.accounts)[0];
            if (cur) {
                document.getElementById('nav-user-avatar').src = cur.avatar;
                document.getElementById('mobile-nav-avatar').src = cur.avatar;
            }
        }

        // UTILS & RELATIONSHIPS
        function openRelationshipsModal(type) {
            const acc = store.accounts[activeProfileId];
            if (!acc) return;
            const list = type === 'followers' ? (acc.followers || []) : (acc.following || []);
            document.getElementById('rel-modal-title').innerText = type === 'followers' ? '팔로워' : '팔로잉';
            const container = document.getElementById('rel-modal-list');
            container.innerHTML = '';
            list.forEach(u => {
                const tAcc = store.accounts[u] || { username: u, avatar: '' };
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between cursor-pointer hover:bg-gray-50 p-1 rounded';
                div.onclick = () => { closeModal('modal-relationships'); viewProfile(u); };
                div.innerHTML = `<div class="flex items-center gap-2"><img src="${tAcc.avatar}" class="w-8 h-8 rounded-full object-cover"><span class="text-xs font-semibold">${u}</span></div><span class="text-xs bg-gray-100 px-2 py-1 rounded">보기</span>`;
                container.appendChild(div);
            });
            document.getElementById('modal-relationships').classList.remove('hidden');
        }

        function toggleLike(postId) {
            const post = store.posts.find(p => p.id === postId);
            if (post) {
                post.likedByMe = !post.likedByMe;
                post.likes += post.likedByMe ? 1 : -1;
                saveStore();
                renderFeed();
            }
        }

        function openPostDetail(postId) {
            currentDetailPostId = postId;
            const post = store.posts.find(p => p.id === postId);
            if (!post) return;
            const authorAcc = store.accounts[post.author] || { username: post.author, avatar: '' };

            document.getElementById('detail-img').src = post.image;
            document.getElementById('detail-avatar').src = authorAcc.avatar;
            document.getElementById('detail-username').innerText = authorAcc.username;
            document.getElementById('detail-caption').innerHTML = `<b>${authorAcc.username}</b> ${formatMentionsAndTags(post.caption)}`;
            document.getElementById('detail-likes-count').innerText = `좋아요 ${post.likes}개`;

            const commentsContainer = document.getElementById('detail-comments-list');
            commentsContainer.innerHTML = post.comments.map(c => `<div><b>${c.author}</b> <span>${formatMentionsAndTags(c.text)}</span></div>`).join('');
            updateAdminUI();
            document.getElementById('modal-post-detail').classList.remove('hidden');
        }

        function handleAddDetailComment(e) {
            e.preventDefault();
            const input = document.getElementById('detail-comment-input');
            const text = input.value.trim();
            if (!text || !currentDetailPostId) return;
            const post = store.posts.find(p => p.id === currentDetailPostId);
            if (post) {
                post.comments.push({ author: store.currentAccount, text });
                saveStore();
                input.value = '';
                openPostDetail(currentDetailPostId);
                renderFeed();
            }
        }

        function toggleDetailLike() {
            if (currentDetailPostId) toggleLike(currentDetailPostId);
        }

        function formatMentionsAndTags(text) {
            if (!text) return '';
            return text
                .replace(/@([a-zA-Z0-9_]+)/g, '<span class="text-pink-600 font-semibold cursor-pointer hover:underline" onclick="event.stopPropagation(); viewProfile(\'$1\')">@$1</span>')
                .replace(/#([가-힣a-zA-Z0-9_]+)/g, '<span class="text-pink-600 font-semibold cursor-pointer hover:underline" onclick="event.stopPropagation(); searchHashtag(\'$1\')">#$1</span>');
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
